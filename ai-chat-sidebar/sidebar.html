<!DOCTYPE html>
<html>

<head>
  <title>智能助手</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="sidebar.css">
</head>

<body>
  <div class="sidebar-container">
    <!-- Floating Hamburger Button -->
    <button id="hamburgerButton" class="hamburger-btn" title="菜单">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Dropdown Menu -->
    <div id="hamburgerMenu" class="hamburger-menu" style="display: none;">
      <div class="menu-section-label">页面</div>
      <button id="menuSummarizePage" class="menu-item">
        <span class="menu-icon">📄</span>
        <span>总结当前网页</span>
      </button>
      <button id="menuExtractContent" class="menu-item">
        <span class="menu-icon">📋</span>
        <span>提取全文为引用</span>
      </button>
      <div class="menu-divider"></div>
      <div class="menu-section-label">对话</div>
      <button id="menuSplitChat" class="menu-item">
        <span class="menu-icon">✂️</span>
        <span>分割当前对话</span>
      </button>
      <button id="menuViewHistory" class="menu-item">
        <span class="menu-icon">🕐</span>
        <span>历史对话</span>
      </button>
      <button id="menuViewArchived" class="menu-item">
        <span class="menu-icon">🗂️</span>
        <span>查看已存档对话</span>
      </button>
      <button id="menuManagePrompts" class="menu-item">
        <span class="menu-icon">⚡</span>
        <span>管理 Prompt</span>
      </button>
      <div class="menu-divider"></div>
      <button id="menuSettings" class="menu-item">
        <span class="menu-icon">⚙️</span>
        <span>设置</span>
      </button>
      <div class="menu-divider"></div>
      <button id="menuClearHistory" class="menu-item menu-item-danger">
        <span class="menu-icon">🗑️</span>
        <span>清除所有历史</span>
      </button>
    </div>

    <!-- History Panel -->
    <div id="historyPanel" class="history-panel" style="display:none;">
      <div class="history-panel-header">
        <span class="history-panel-title">历史对话</span>
        <button id="historyPanelClose" class="history-panel-close" title="关闭">×</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>

    <div class="chat-area">
      <div id="chatOutput">
      </div>

      <!-- Floating input area -->
      <div class="input-float">
        <div id="contextChips" class="context-chips" style="display:none;"></div>
        <div id="promptShortcutsBar" class="prompt-shortcuts-bar">
          <div id="promptShortcuts" class="prompt-shortcuts-scroll"></div>
          <button id="addPromptButton" class="prompt-shortcut-add" title="管理 Prompt 模板">+</button>
        </div>
        <textarea id="chatInput" placeholder="有问题，尽管问"></textarea>
        <div class="send-area-container">
          <button id="addContextButton" class="add-context-btn" title="添加当前页面为上下文">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.49"></path></svg>
          </button>
          <span class="shortcut-hint">Enter 发送 / Shift+Enter 换行</span>
          <button id="sendMessageButton" title="发送">
            <img src="icon/send.png" alt="发送" width="18" height="18">
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="/libs/marked.min.js"></script>
  <script src="sidebar.js"></script>
</body>

</html>
